
name: Lint Code

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Check Python Files
        run: |
          python -m compileall -q .
          find . -type d \( -name .git -o -name node_modules -o -name venv -o -name .venv \) -prune -o -type f -name "*.py" -print0 | xargs -0 -r flake8 --select=E9,F63,F7,F82
          echo "Python checks completed successfully"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JSHint
        run: npm install --global jshint

      - name: Check JavaScript Files
        shell: bash
        run: |
          if [ -d "./server/database" ]; then
            find ./server/database -type f -name "*.js" -print0 | xargs -0 -r jshint
          else
            echo "server/database directory not found; skipping this directory-specific check"
          fi
